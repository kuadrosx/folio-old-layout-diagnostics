<!DOCTYPE html>
<html>
<head>
<style>
@font-face {
  font-family: 'Nimbus Sans';
  src: url('NimbusSans-Bold.otf');
  font-weight: bold;
}
body { margin: 0; }
/* One construct: a long unbreakable Nimbus Sans Bold token in a fixed-width box.
   Regression case for FOLIO-GAP-02 across fonts other than Poppins —
   folio must respect white-space:nowrap (overflow, not character-break)
   regardless of which font's advances are being measured. */
.box {
  font-family: 'Nimbus Sans';
  font-weight: bold;
  font-size: 16px;
  width: 320px;
  white-space: nowrap;
  background: #eef;
}
</style>
</head>
<body>
<div class="box">ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789</div>
</body>
</html>
