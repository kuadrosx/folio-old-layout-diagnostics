<!DOCTYPE html>
<html>
<head>
<style>
.box   { float: left; width: 50%; background: #eef; }
.after { background: #efe; }
</style>
</head>
<body>
<div class="box"><h2>Floated box (50%)</h2><p>Float line one.</p><p>Float line two.</p></div>
<div class="after"><h2>Following content</h2><p>This must NOT overlap the floated box above.</p></div>
</body>
</html>
